name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Test against current LTS and the next weekly to catch regressions early
        jenkins-version: [ "2.504.1", "latest" ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B verify --no-transfer-progress
        env:
          JENKINS_VERSION: \${{ matrix.jenkins-version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-\${{ matrix.jenkins-version }}
          path: target/surefire-reports/
          retention-days: 7
